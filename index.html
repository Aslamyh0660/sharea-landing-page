<!doctype html>
<html lang="ar" dir="rtl" class="dark" data-motion="expressive">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>شارع · Sharea — هذا المكان معتمد من شارع</title>
    <meta
      name="description"
      content="وجود رمز شارع الرسمي في هذا المكان يعني أنه من الأماكن المعتمدة لدى شارع. خدمات متكاملة للزوار والطلاب العرب في قم عبر بوت تيليغرام."
    />
    <meta name="theme-color" content="#091423" />
    <meta name="color-scheme" content="dark" />

    <!-- Social preview. NOTE: og:image / og:url must point at the final domain
         after the first deploy — see README ("After your first deploy"). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sharea · شارع" />
    <meta property="og:title" content="شارع · Sharea — هذا المكان معتمد من شارع" />
    <meta
      property="og:description"
      content="خدمات متكاملة للزوار والطلاب العرب في قم عبر بوت شارع على تيليغرام."
    />
    <meta property="og:image" content="/assets/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ar_AR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="شارع · Sharea — هذا المكان معتمد من شارع" />
    <meta
      name="twitter:description"
      content="خدمات متكاملة للزوار والطلاب العرب في قم عبر بوت شارع على تيليغرام."
    />
    <meta name="twitter:image" content="/assets/og.png" />

    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/site.webmanifest" />

    <!-- the portrait sits above the fold (top bar lockup) -->
    <link rel="preload" as="image" href="/assets/portrait.jpg" />

    <!-- mark JS availability before first paint: the reveal effect only hides
         content when JS is present; without JS nothing is ever hidden -->
    <script>
      document.documentElement.classList.add("js")
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
